<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | Kinaiya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main-style.css">
    <link rel="stylesheet" href="css/cart.css">

</head>

<body>

    <header class="site-header">
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">

                <a class="navbar-brand brand" href="index.html">
                    <img src="images/logo.png" alt="Kinaiya" height="40">
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="nav">

                    <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">

                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="categories.html">Categories</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="community.html">Community</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="about us.html">About</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="contact us.html">Contact Us</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active" href="cart.html">Cart</a>
                        </li>

                    </ul>

                </div>

            </div>
        </nav>
    </header>

    <main class="cart-wrapper">

        <header class="cart-header">

            <div class="cart-title">
                Your Cart
            </div>

            <span class="badge" id="itemCount">
                0 items
            </span>

        </header>

        <section class="cart-items" id="cartItems"></section>

        <section class="summary" id="cartSummary">

            <div class="summary-row">
                <span>Subtotal</span>
                <span id="subtotal">₱0.00</span>
            </div>

            <div class="summary-row">
                <span>Shipping</span>
                <span id="shipping">₱50.00</span>
            </div>

            <div class="summary-total">
                <span>Total</span>
                <span id="total">₱0.00</span>
            </div>

            <button class="checkout-btn" id="checkoutBtn">
                Checkout
            </button>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        const CART_KEY = "kinaiya-cart";

        let cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];

        const itemsEl = document.getElementById("cartItems");
        const countEl = document.getElementById("itemCount");
        const subtotalEl = document.getElementById("subtotal");
        const shippingEl = document.getElementById("shipping");
        const totalEl = document.getElementById("total");
        const summaryEl = document.getElementById("cartSummary");

        function saveCart() {
            localStorage.setItem(
                CART_KEY,
                JSON.stringify(cart)
            );
        }

        const GAME_IMAGES = {
            "eskinita": "images/horror/eskinita.jpg",
            "hapunan": "images/horror/hapunan.jpg",
            "hablon": "images/adventure/hablon.jpg",
            "until-then": "images/adventure/until_then.jpg",
            "jeepney": "images/simulation/jeepney.jpg",
            "lutong-bahay": "images/simulation/lutongbahay.png",
            "maiba-taya": "images/survival/maiba_taya.jpg",
            "strandead": "images/survival/strandead.jpg",
            "bayani": "images/fighting/bayani.jpg",
            "sepak": "images/fighting/sepak.jpg"
        };

        function imageFor(item) {
            return GAME_IMAGES[item.id] || "images/logo.png";
        }

        function formatMoney(value) {
            return "₱" + value.toFixed(2);
        }

        function renderCart() {

            const totalQty = cart.reduce(
                (sum, item) => sum + item.qty,
                0
            );

            countEl.textContent =
                totalQty +
                (totalQty === 1 ? " item" : " items");

            if (cart.length === 0) {

                itemsEl.innerHTML = `
            <div class="empty-state">
                <div class="empty-emoji">🛒</div>
                <p>Your cart is empty.</p>
            </div>
        `;

                summaryEl.style.display = "none";
                return;
            }

            summaryEl.style.display = "block";

            itemsEl.innerHTML = cart.map(item => `
    <article class="item-card">

    <div class="thumb">
        <img src="${imageFor(item)}" alt="${item.name}">
    </div>

    <div class="item-info">
        <div class="item-name">${item.name}</div>
        <div class="item-meta">Game</div>
        <div class="item-price">${formatMoney(item.price)}</div>
    </div>
    <div class="controls">
    <button class="remove-btn"
            onclick="removeItem('${item.id}')">
        Remove
    </button>
    </div>

</article>

`).join("");

            const subtotal = cart.reduce(
                (sum, item) =>
                    sum + item.price * item.qty,
                0
            );

            const shipping =
                subtotal >= 1000 ? 0 : 50;

            subtotalEl.textContent =
                formatMoney(subtotal);

            shippingEl.textContent =
                shipping === 0
                    ? "FREE"
                    : formatMoney(shipping);

            totalEl.textContent =
                formatMoney(subtotal + shipping);
        }

        function changeQty(id, delta) {

            const item = cart.find(
                item => item.id === id
            );

            if (!item) return;

            item.qty += delta;

            if (item.qty <= 0) {
                removeItem(id);
                return;
            }

            saveCart();
            renderCart();
        }

        function removeItem(id) {

            cart = cart.filter(
                item => item.id !== id
            );

            saveCart();
            renderCart();
        }

        document
            .getElementById("checkoutBtn")
            .addEventListener("click", function () {

                if (cart.length === 0) {
                    alert("Your cart is empty.");
                    return;
                }

                alert("Thank you for your order!");

                cart = [];

                saveCart();
                renderCart();
            });

        renderCart();

    </script>

</body>

</html>
